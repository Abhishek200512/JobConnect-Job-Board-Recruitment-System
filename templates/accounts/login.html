{% extends "base.html" %}
{% block title %}Login — JobConnect{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="text-muted">Sign in to continue to JobConnect</p>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
      <div class="mb-4">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" placeholder="name@example.com" autofocus required>
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" placeholder="••••••••" required>
      </div>
      <div class="d-flex justify-content-end mb-4">
        <a href="{% url 'forgot_password' %}" class="small">Forgot password?</a>
      </div>
      <button class="btn btn-primary w-100 mb-4">Sign In</button>
      
      <div class="text-center text-small">
        <span class="text-muted">Don't have an account?</span> 
        <a href="{% url 'register' %}" class="fw-semibold">Create account</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
