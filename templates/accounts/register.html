{% extends "base.html" %}
{% block title %}Create Account — JobConnect{% endblock %}
{% block content %}
<div class="auth-wrap py-5">
  <div class="auth-card" style="max-width: 500px;">
    <h2>Create your account</h2>
    <p class="text-muted">Join JobConnect today</p>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <ul class="nav nav-pills nav-justified mb-4" id="roleTabs">
      <li class="nav-item">
        <button class="nav-link {% if role != 'recruiter' %}active{% endif %} rounded-3 fw-semibold" data-bs-toggle="pill" data-bs-target="#seekerPane" type="button">Job Seeker</button>
      </li>
      <li class="nav-item ms-2">
        <button class="nav-link {% if role == 'recruiter' %}active{% endif %} rounded-3 fw-semibold" data-bs-toggle="pill" data-bs-target="#recruiterPane" type="button">Recruiter</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade {% if role != 'recruiter' %}show active{% endif %}" id="seekerPane">
        <form method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="role" value="seeker">
          <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" name="full_name" value="{{ form.full_name|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ form.username|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{ form.email|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Phone (Optional)</label><input class="form-control" name="phone" value="{{ form.phone|default:'' }}"></div>
          <div class="row">
            <div class="col-sm-6 mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
            <div class="col-sm-6 mb-4"><label class="form-label">Confirm Password</label><input type="password" class="form-control" name="password2" required></div>
          </div>
          <button class="btn btn-primary w-100 mb-3">Create Seeker Account</button>
        </form>
      </div>

      <div class="tab-pane fade {% if role == 'recruiter' %}show active{% endif %}" id="recruiterPane">
        <form method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="role" value="recruiter">
          <div class="mb-3"><label class="form-label">Your Name</label><input class="form-control" name="full_name" value="{{ form.full_name|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ form.username|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Work Email</label><input type="email" class="form-control" name="email" value="{{ form.email|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Company Name</label><input class="form-control" name="company_name" value="{{ form.company_name|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Phone (Optional)</label><input class="form-control" name="phone" value="{{ form.phone|default:'' }}"></div>
          <div class="row">
            <div class="col-sm-6 mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
            <div class="col-sm-6 mb-4"><label class="form-label">Confirm Password</label><input type="password" class="form-control" name="password2" required></div>
          </div>
          <button class="btn btn-primary w-100 mb-3">Create Recruiter Account</button>
        </form>
      </div>
    </div>
    
    <div class="text-center text-small mt-2">
      <span class="text-muted">Already registered?</span> 
      <a href="{% url 'login' %}" class="fw-semibold">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
