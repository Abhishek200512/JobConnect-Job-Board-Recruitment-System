{% extends "base.html" %}
{% block title %}Reset Password — JobConnect{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-panel w-100">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock fs-1 text-primary"></i>
        <h1 class="h4 mt-3">Set a new password</h1>
        <p class="text-muted small">Enter the code sent to <strong>{{ email }}</strong> and choose a new password.</p>
      </div>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Reset Code</label>
          <input class="form-control" name="code" maxlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" name="password" minlength="8" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" name="password2" minlength="8" required>
        </div>
        <button class="btn btn-primary w-100">Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
