{% extends "base.html" %}
{% block title %}Forgot Password — JobConnect{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-panel w-100">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-key fs-1 text-primary"></i>
        <h1 class="h4 mt-3">Forgot your password?</h1>
        <p class="text-muted small">Enter your registered email and we'll send you a reset code.</p>
      </div>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <button class="btn btn-primary w-100">Send Reset Code</button>
      </form>
      <p class="text-center small mt-3 mb-0"><a href="{% url 'login' %}">Back to login</a></p>
    </div>
  </div>
</div>
{% endblock %}
